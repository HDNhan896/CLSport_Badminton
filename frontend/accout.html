<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link rel="icon" href="https://i.postimg.cc/85b8BVH2/logo.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="./js/layout.js"></script>
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="stylesheet" href="../frontend/css/accout.css">
</head>

<body>

    <header id="header" class="header"></header>

    <main class="login-page py-5 bg-light d-flex align-items-center ">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-orange text-uppercase">Đăng nhập</h3>
                            <div class="mx-auto mt-2"
                                style="width: 50px; height: 3px; background-color: var(--primary-orange);"></div>
                        </div>

                       <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email / Số điện thoại</label>
                                <input type="text" id="username"
                                    class="form-control form-control-lg fs-6"
                                    placeholder="Nhập email hoặc số điện thoại" required>
                                <div class="text-danger small mt-1" id="errorUser"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu</label>
                                <div class="position-relative">
                                    <input type="password" id="password"
                                        class="form-control form-control-lg fs-6"
                                        placeholder="Nhập mật khẩu" required>

                                    <!-- NÚT CON MẮT -->
                                    <button type="button" id="togglePassword"
                                        class="btn position-absolute top-50 end-0 translate-middle-y border-0 shadow-none text-muted">
                                        <i class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                                <div class="text-danger small mt-1" id="errorPass"></div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label small" for="rememberMe">Ghi nhớ</label>
                                </div>
                                <a href="forgot-password.html"
                                    class="text-decoration-none small text-muted hover-orange">Quên mật khẩu?</a>
                            </div>

                           <button class="btn w-100 fw-bold text-white" style="background:#e85d2a;">
                                Đăng nhập
                            </button>

                            <div class="text-center">
                                <span class="small text-muted">Chưa có tài khoản? </span>
                                <a href="signup.html" class="small text-orange fw-bold text-decoration-none">Đăng ký tại
                                    đây</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="site-footer"></footer>


    <script src="./js/accout.js"></script>

</body>

</html>
