<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - CLSports</title>
    <link rel="icon" href="https://i.postimg.cc/85b8BVH2/logo.png" type="image/png">
    <script src="./js/layout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="stylesheet" href="../frontend/css/forgot-password.css">

</head>

<body>

    <header id="header" class="header"></header>
    <main class="login-page d-flex align-items-center justify-content-center mt-5 mb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <h3 class="text-center fw-bold text-uppercase text-orange mb-3">
                            Quên mật khẩu
                        </h3>
                        <div class="login-line mx-auto mb-4"></div>
                        <form>
                            <div class="mb-3">
                                <input type="email" class="form-control form-custom" placeholder="Nhập email của bạn">
                            </div>
                            <button type="submit" class="btn btn-orange w-100 mb-3 text-white" style="background:#e85d2a;">
                                Lấy lại mật khẩu
                            </button>
                            <div class="text-center small">
                                <a href="accout.html" class="text-decoration-none text-orange fw-bold">
                                    Đăng nhập tại đây
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer" class="site-footer"></footer>
</body>

</html>
