<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng-ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="stylesheet" href="../frontend/css/signup.css">
    <script src="./js/layout.js"></script>
</head>

<body>

    <header id="header" class="header"></header>

    <main class="login-page d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">

                        <h3 class="text-center fw-bold text-uppercase text-orange mb-3">
                            Đăng ký
                        </h3>

                        <div class="login-line mx-auto mb-3"></div>

                        <p class="text-center small mb-4">
                            Đã có tài khoản,
                            <a href="accout.html" class="text-orange fw-bold text-decoration-none">
                                đăng nhập tại đây
                            </a>
                        </p>

                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control form-custom" placeholder="Nhập tên của bạn (*)">
                            </div>

                            <div class="mb-3">
                                <input type="email" class="form-control form-custom"
                                    placeholder="Nhập email của bạn (*)">
                            </div>

                            <div class="mb-3">
                                <input type="text" class="form-control form-custom" placeholder="Số điện thoại">
                            </div>

                            <div class="mb-3">
                                <input type="password" class="form-control form-custom" placeholder="Mật khẩu">
                            </div>

                            <div class="mb-3">
                                <input type="password" class="form-control form-custom" placeholder="Nhập lại mật khẩu">
                            </div>

                            <button type="submit" class="btn btn-orange w-100">
                                ĐĂNG KÝ
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer id="footer" class="site-footer"></footer>


</body>

</html>
