<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/layout.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/product_list.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="./js/product.js"></script>
    <style>
        /* 1. Ép lớp nền đen xuống thấp hơn */
        .offcanvas-backdrop {
            z-index: 1040 !important;
        }

        /* 2. Ép Offcanvas vọt lên trên lớp nền */
        .offcanvas {
            z-index: 1070 !important; /* Cao hơn hẳn 1040 */
        }
    </style>
    <title>Document</title>
</head>
<body>
    <div id="Loc" class="d-none d-md-block p-3 border rounded bg-light">
        <h5 class="mb-3"><i class="bi bi-filter"></i> Bộ lọc sản phẩm</h5>
        
        <div class="mb-4">
            <h6>Danh mục</h6>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cat1">
                <label class="form-check-label" for="cat1">Điện thoại</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cat2">
                <label class="form-check-label" for="cat2">Laptop</label>
            </div>
        </div>
    
        <div class="mb-4">
            <h6>Khoảng giá</h6>
            <select class="form-select form-select-sm">
                <option selected>Tất cả mức giá</option>
                <option value="1">Dưới 5 triệu</option>
                <option value="2">5 - 15 triệu</option>
                <option value="3">Trên 15 triệu</option>
            </select>
        </div>
    
        <button class="btn btn-primary btn-sm w-100" onclick="alert('Đang áp dụng bộ lọc!')">Áp dụng</button>
    </div>
    <div class="position-fixed top-50 end-0 translate-middle-y d-md-none" style="z-index: 1060;">
        <button class="btn btn-danger shadow-lg" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu" style="writing-mode: vertical-rl; padding: 15px 5px;">
            <i class="bi bi-funnel"></i> LỌC
        </button>
    </div>
    
    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
        <div class="offcanvas-header bg-danger text-white">
            <h5 class="offcanvas-title" id="mobileMenuLabel">BỘ LỌC TÌM KIẾM</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="Loc-offcanva">
            <div class="text-center p-5">
                <div class="spinner-border text-secondary" role="status"></div>
                <p>Đang tải nội dung...</p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const source = document.getElementById('Loc');
            const target = document.getElementById('Loc-offcanva');
    
            if (source && target) {
                // Copy nội dung
                target.innerHTML = source.innerHTML;
    
                // Mẹo: Đổi ID của các input trong Offcanvas để không trùng với Desktop
                // Giúp việc click vào Label trong Offcanvas hoạt động chính xác
                const inputs = target.querySelectorAll('input, label');
                inputs.forEach(el => {
                    if(el.id) el.id += '-mob';
                    if(el.getAttribute('for')) el.setAttribute('for', el.getAttribute('for') + '-mob');
                });
            }
        });
    </script>
</body>
</html>
