<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng của bạn</title>
    <script src="./js/layout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/cart.js" defer></script>
</head>

<body>

    <header id="header" class="header"></header>

    <main class="cart-page py-5 bg-light">
        <div class="container">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-dark">Trang chủ</a></li>
                    <li class="breadcrumb-item active text-orange" aria-current="page">Giỏ hàng</li>
                </ol>
            </nav>

            <div class="cart-container shadow-sm bg-white rounded">
                <h5 class="cart-title p-3 mb-0 text-uppercase fw-bold">Giỏ hàng của bạn</h5>

                <!-- KHỐI KHI CÓ SẢN PHẨM -->
                <div id="cart-full">
                    <div class="cart-header-bar text-white p-2 px-3 fw-bold" style="background-color: #333;">GIỎ HÀNG</div>

                    <div class="cart-items p-3">
                        <!-- Sản phẩm sẽ được render tự động bởi JavaScript vào đây -->
                    </div>

                    <div id="cart-summary" class="p-3">
                        <div class="row mb-3">
                            <div class="col-12">
                                <h6 class="fw-bold text-uppercase mb-3">Tóm tắt đơn hàng</h6>
                                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                                    <span class="text-muted">Tổng tiền hàng:</span>
                                    <span id="cart-total-amount" class="fw-bold">0 đ</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                                    <span class="text-muted">Phí vận chuyển:</span>
                                    <span class="fw-bold text-success">Miễn phí</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="fw-bold text-uppercase">Tổng cộng:</span>
                                    <span id="cart-grand-total" class="fs-5 fw-bold text-orange">0 đ</span>
                                </div>
                            </div>
                        </div>
                        <a href="checkout.html"
                            class="btn btn-danger w-100 py-2 fw-bold text-uppercase fs-5 text-decoration-none d-block text-center">
                            Đặt hàng
                        </a>
                    </div>
                </div>

                <!-- KHỐI KHI GIỎ HÀNG TRỐNG (Được JS tự động bỏ class d-none khi giỏ rỗng) -->
                <div id="cart-empty" class="text-center py-5 d-none">
                    <div class="mb-4">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 5rem; color: #dee2e6;"></i>
                    </div>
                    <h4 class="fw-bold">Giỏ hàng trống</h4>
                    <p class="text-muted mb-4">Bạn chưa có sản phẩm nào trong giỏ hàng.</p>
                    <a href="product_list.html"
                        class="btn px-4 py-2 text-white text-decoration-none" style="background-color: #d85427; border-radius: 25px;">
                        Mua sắm ngay &rarr;
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="site-footer"></footer>

</body>
</html>
