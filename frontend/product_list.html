<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/product_list.css">
    <title>Products</title>
</head>
<body>
    <header id="header"></header>
    <div class="container-fluid my-3">
        <section class="container-fluid">
            <div class="row px-3 g-3">
                <div class="col-12 col-md-3 filter-box d-none d-md-block" id="Loc">
                    <div class="row">
                        <div class="mb-3 border-bottom ps-4">
                            <div class="fw-bold mb-4">
                                Chọn mức giá
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input" type="checkbox" id="price1" value="0-500000">
                                <label class="form-check-label" for="price1">
                                    Giá dưới 500.00 Đ
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input" type="checkbox" id="price2" value="500000-1000000">
                                <label class="form-check-label" for="price2">
                                    500.00 Đ đến 1 Triệu
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input" type="checkbox" id="price3" value="1000000-2000000">
                                <label class="form-check-label" for="price3">
                                    1-2 triệu
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input" type="checkbox" id="price4" value="2000000-3000000">
                                <label class="form-check-label" for="price4">
                                    2-3 triệu
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input" type="checkbox" id="price5" value="3000000-max">
                                <label class="form-check-label" for="price5">
                                    Trên 3 triệu
                                </label>
                            </div>
                        </div>
                        <div class="mb-3 border-bottom ps-4">
                            <div class="fw-bold mb-4">
                                Trọng lượng
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weight1">
                                <label class="form-check-label" for="weight1">
                                    2U: 90-94g
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weight2">
                                <label class="form-check-label" for="weight2">
                                    3U: 85-89g
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weight3">
                                <label class="form-check-label" for="weight3">
                                    4U: 80-84g
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weight4">
                                <label class="form-check-label" for="weight4">
                                    5U: 75-79g
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weight1">
                                <label class="form-check-label" for="weight1">
                                    F: 70-74g
                                </label>
                            </div>
                        </div>
                        <div class="mb-3 border-bottom ps-4">
                            <div class="fw-bold mb-4">
                                Điểm cân bằng
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="light-head">
                                <label class="form-check-label" for="light-head">
                                    Nhẹ đầu
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Balance">
                                <label class="form-check-label" for="Balance">
                                    Cân bằng
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="quite-heavy">
                                <label class="form-check-label" for="quite-heavy">
                                    Hơi nặng đầu
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Heavy">
                                <label class="form-check-label" for="Heavy">
                                    Nặng đầu
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="very-heavy">
                                <label class="form-check-label" for="very-heavy">
                                    Siêu nặng đầu
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-9">
                    <div class="row bg-body-secondary mx-2 my-3 rounded">
                        <div class="col-6">
                            <h3>Shop cầu lông web</h3>
                        </div>
                        <div class="col-6 text-end">
                            <div class="dropdown">
                                <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Xắp xếp theo giá
                                </button>
                                <ul class="dropdown-menu">
                                  <li><a onclick="giaTangDan(event)" class="dropdown-item" href="#">Giá tăng đần</a></li>
                                  <li><a onclick="giaGiamDan(event)" class="dropdown-item" href="#">Giá giảm dần</a></li>
                                  <li><a class="dropdown-item" href="#">Hàng mới nhất</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="row g-1" id="sanPham">
                        
                    </div>    
                </div>
                
            </div>

        </section>
    </div>
    
    <footer id="footer" class="site-footer"></footer>
    <div class="position-fixed top-50 end-0 d-block d-md-none">
        <button class="btn btn-danger d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"><i class="bi bi-funnel"></i>Lọc</button>
    </div>
    <div class="offcanvas offcanvas-end" id="mobileMenu" data-bs-backdrop="true" tabindex="-1">
        <div class="offcanvas-body" id="Loc-offcanva">
          
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/product-list.js"></script>
</body>
</html>
