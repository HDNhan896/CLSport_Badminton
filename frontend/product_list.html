<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/product_list.css">
    <title>Products</title>
</head>
<body>
    <header id="header"></header>
    <div class="container my-3">
        <section class="container-fluid">
            <div class="row px-3 g-4">
                <div class="col-12 col-md-3 d-none d-md-block" >
                    <div class="row filter-box pt-3 pb-3" id="Loc">
                        <div class="mb-3 border-bottom p-3 ps-4">
                            <div class="fw-bold mb-4">
                                Danh mục sản phẩm
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category1" value="Vợt-Cầu-Lông">
                                <label class="form-check-label" for="category1">
                                    Vợt cầu lông
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category2" value="Giày-Cầu-Lông">
                                <label class="form-check-label" for="category2">
                                    Giày cầu lông
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category3" value="Áo-Cầu-Lông">
                                <label class="form-check-label" for="category3">
                                    Áo cầu lông
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category4" value="Quần-Cầu-Lông">
                                <label class="form-check-label" for="category4">
                                    Quần cầu lông
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category5" value="Túi-Cầu-Lông">
                                <label class="form-check-label" for="category5">
                                    Túi cầu lông
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoDanhMuc()" class="form-check-input rounded-5" type="checkbox" id="category6" value="Phụ-Kiện">
                                <label class="form-check-label" for="category6">
                                    Phụ kiện cầu lông
                                </label>
                            </div>
                        </div>
                        <div class="mb-3 ps-4">
                            <div class="fw-bold mb-4">
                                Chọn mức giá
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input rounded-5" type="checkbox" id="price1" value="0-500000">
                                <label class="form-check-label" for="price1">
                                    Dưới 500.000đ
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input rounded-5" type="checkbox" id="price2" value="500000-1000000">
                                <label class="form-check-label" for="price2">
                                    500.000đ đến 1.000.000đ
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input rounded-5" type="checkbox" id="price3" value="1000000-2000000">
                                <label class="form-check-label" for="price3">
                                    1.000.000đ - 2.000.000đ
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input rounded-5" type="checkbox" id="price4" value="2000000-3000000">
                                <label class="form-check-label" for="price4">
                                    2.000.000đ - 3.000.000đ
                                </label>
                            </div>
                            <div class="form-check">
                                <input onchange="locTheoGia()" class="form-check-input rounded-5" type="checkbox" id="price5" value="3000000-max">
                                <label class="form-check-label" for="price5">
                                    Trên 3.000.000đ
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-9">
                    <div class="row mx-2 my-3 rounded">
                        <div class="col-6"></div>
                        <div class="col-6 text-end">
                            <div class="dropdown">
                                <button class="btn btn-light border-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Sắp xếp
                                </button>
                                <ul class="dropdown-menu">
                                  <li><a onclick="giaTangDan(event)" class="dropdown-item" href="#">Giá tăng dần</a></li>
                                  <li><a onclick="giaGiamDan(event)" class="dropdown-item" href="#">Giá giảm dần</a></li>
                                  <li><a onclick="hangMoiNhat(event)" class="dropdown-item" href="#">Hàng mới nhất</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="row g-1" id="sanPham">
                        
                    </div>    
                </div>
                
            </div>

        </section>
    </div>
    
    <footer id="footer" class="site-footer"></footer>
    <div class="position-fixed top-50 end-0 d-block d-md-none">
        <button class="btn btn-danger d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"><i class="bi bi-funnel"></i>Lọc</button>
    </div>
    <div class="offcanvas offcanvas-end" id="mobileMenu" data-bs-backdrop="true" tabindex="-1">
        <div class="offcanvas-body" id="Loc-offcanva">
          
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/layout.js"></script>
    <script type="module" src="./js/product-list.js"></script>
    <script type="module" src="./js/cart.js"></script>
</body>
</html>
