<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng-ký</title>
    <link rel="icon" href="https://i.postimg.cc/85b8BVH2/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="stylesheet" href="../frontend/css/signup.css">
    <script src="./js/layout.js"></script>
</head>

<body>

    <header id="header" class="header"></header>

    <main class="login-page d-flex align-items-center justify-content-center mt-5 mb-5">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">

                        <h3 class="text-center fw-bold text-uppercase text-orange mb-3">
                            Đăng ký
                        </h3>

                        <div class="login-line mx-auto mb-3"></div>

                        <p class="text-center small mb-4">
                            Đã có tài khoản,
                            <a href="accout.html" class="text-orange fw-bold text-decoration-none">
                                đăng nhập tại đây
                            </a>
                        </p>

                        <form id="signupForm">
                            <div class="mb-3">
                                <input type="text" id="name" class="form-control form-custom"
                                    placeholder="Nhập tên của bạn">
                                <div class="text-danger small" id="errorName"></div>
                            </div>

                            <div class="mb-3">
                                <input type="text" id="email" class="form-control form-custom"
                                    placeholder="Nhập email của bạn">
                                <div class="text-danger small" id="errorEmail"></div>
                            </div>

                            <div class="mb-3">
                                <input type="text" id="phone" class="form-control form-custom"
                                    placeholder="Số điện thoại">
                                <div class="text-danger small" id="errorPhone"></div>
                            </div>

                            <div class="mb-3">
                                <input type="password" id="password" class="form-control form-custom"
                                    placeholder="Mật khẩu">
                                <div class="text-danger small" id="errorPass"></div>
                            </div>

                            <div class="mb-3">
                                <input type="password" id="repassword" class="form-control form-custom"
                                    placeholder="Nhập lại mật khẩu">
                                <div class="text-danger small" id="errorRePass"></div>
                            </div>

                            <button type="submit" class="btn btn-orange w-100 text-white" style="background:#e85d2a;">
                                ĐĂNG KÝ
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal Thành Công Đăng Ký -->
    <div class="modal fade" id="successSignupModal" tabindex="-1" aria-labelledby="successSignupLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-body text-center p-5">
                    <div class="mb-4">
                        <i class="fa-regular fa-circle-check text-success" style="font-size: 80px;"></i>
                    </div>
                    <h4 class="fw-bold mb-2" style="color: #333;">Đăng Ký Thành Công!</h4>
                    <p class="text-muted mb-4">Tài khoản của bạn đã được tạo. Vui lòng đăng nhập để tiếp tục mua sắm.</p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <a href="accout.html" class="btn btn-success px-5 py-2 fw-bold rounded-pill text-white">
                        <i class="fa-solid fa-arrow-right me-2"></i>Đăng Nhập Ngay
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/signup.js"></script>

</body>

</html>
